# CI — lint and test on every push to main and every pull request.
# Named "CI" so the growth-sync workflow's workflow_run trigger captures it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q
